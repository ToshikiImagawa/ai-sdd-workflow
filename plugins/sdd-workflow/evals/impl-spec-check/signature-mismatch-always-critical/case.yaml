schema_version: "1.1"
name: impl-spec-check/signature-mismatch-always-critical
description: "spec quality-guardrails/impl-spec-check 3.1.1 invariant: a public API signature mismatch is Critical regardless of impl-status"
tags: [impl-spec-check, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: regex
    name: archive_task_is_critical
    target: last_message
    pattern: "archive_task.*\\bCritical\\b|\\bCritical\\b.*archive_task"
    flags: im
    match: "contains"
expected_outcome: "archive_task is reported as Critical."
