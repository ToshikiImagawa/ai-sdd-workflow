schema_version: "1.1"
name: impl-spec-check/missing-impl-unset-is-warning
description: "spec quality-guardrails/impl-spec-check 3.1.1 row 4: missing implementation is Warning when impl-status is unset"
tags: [impl-spec-check, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: regex
    name: archive_task_is_warning
    target: last_message
    pattern: "archive_task.*\\bWarning\\b|\\bWarning\\b.*archive_task"
    flags: im
    match: "contains"
expected_outcome: "archive_task is reported as Warning."
