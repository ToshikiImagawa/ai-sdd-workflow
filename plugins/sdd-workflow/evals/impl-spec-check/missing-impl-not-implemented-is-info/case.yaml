schema_version: "1.1"
name: impl-spec-check/missing-impl-not-implemented-is-info
description: "spec quality-guardrails/impl-spec-check 3.1.1 row 2: missing implementation is Info when impl-status is not-implemented"
tags: [impl-spec-check, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - type: regex
    name: archive_task_is_info
    target: last_message
    pattern: "archive_task.*\\bInfo\\b|\\bInfo\\b.*archive_task"
    flags: im
    match: "contains"
expected_outcome: "archive_task is reported as Info."
