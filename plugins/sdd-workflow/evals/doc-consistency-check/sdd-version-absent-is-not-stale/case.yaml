schema_version: "1.1"
name: doc-consistency-check/sdd-version-absent-is-not-stale
description: "spec quality-guardrails/doc-consistency-check 3.1.2 row 1: absent sdd-version is not an FR-007 (stale) target"
tags: [doc-consistency-check, prose, spec-3.1.2]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: regex
    name: legacy_not_listed_as_stale
    target: last_message
    pattern: "\\b(?:stale)\\b(?:(?!unknown|absent)[\\s\\S]){0,600}^[ \\t]*[-*|\\d][^\\n]*legacy\\.md"
    flags: im
    match: "not_contains"
  - type: regex
    name: legacy_listed_as_unknown
    target: last_message
    pattern: "\\b(?:unknown|absent)\\b(?:(?!stale)[\\s\\S]){0,600}^[ \\t]*[-*|\\d][^\\n]*legacy\\.md"
    flags: im
    match: "contains"
