schema_version: "1.1"
name: prd-generation/next-id-empty-starts-at-001
description: "spec prd-generation 3.3.2 row 1: with no existing FR ids the new id is FR_001"
tags: [prd-generation, prose, spec-3.3.2]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
graders:
  - type: regex
    name: new_fr_is_001
    target:
      source: file
      path: .sdd/requirement/task-management.md
    pattern: "\\bFR_001\\b"
    flags: im
    match: "contains"
  - type: regex
    name: no_fr_002_created
    target:
      source: file
      path: .sdd/requirement/task-management.md
    pattern: "\\bFR_002\\b"
    flags: im
    match: "not_contains"
expected_outcome: "The amended PRD contains FR_001 and no FR_002."
