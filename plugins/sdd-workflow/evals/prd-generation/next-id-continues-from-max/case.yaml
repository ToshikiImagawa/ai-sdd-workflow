schema_version: "1.1"
name: prd-generation/next-id-continues-from-max
description: "spec prd-generation 3.3.2 row 2: with existing FR_001..FR_003 the new id is FR_004"
tags: [prd-generation, prose, spec-3.3.2]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
graders:
  - type: regex
    name: new_fr_is_004
    target:
      source: file
      path: .sdd/requirement/task-management.md
    pattern: "\\bFR_004\\b"
    flags: im
    match: "contains"
  - type: regex
    name: existing_ids_kept
    target:
      source: file
      path: .sdd/requirement/task-management.md
    pattern: "\\bFR_001\\b[\\s\\S]*\\bFR_002\\b[\\s\\S]*\\bFR_003\\b"
    flags: im
    match: "contains"
  - type: regex
    name: no_fr_005_created
    target:
      source: file
      path: .sdd/requirement/task-management.md
    pattern: "\\bFR_005\\b"
    flags: im
    match: "not_contains"
expected_outcome: "The amended PRD contains FR_004, keeps FR_001..FR_003 and has no FR_005."
