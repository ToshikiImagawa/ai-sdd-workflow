schema_version: "1.1"
name: front-matter-validation/sdd-version-invalid-or-old-is-warning
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 15: sdd-version not semver or older major -> warning"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: sdd_version_invalid_or_old_is_warning
    target: last_message
    pattern: "\\bwarning\\b.*(?<![\\w-])(?:sdd-version)(?![\\w-])|(?<![\\w-])(?:sdd-version)(?![\\w-]).*\\bwarning\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity warning."
