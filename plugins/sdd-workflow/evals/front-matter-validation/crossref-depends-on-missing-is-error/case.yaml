schema_version: "1.1"
name: front-matter-validation/crossref-depends-on-missing-is-error
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 5: depends-on target does not exist under --cross-ref -> error"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: crossref_depends_on_missing_is_error
    target: last_message
    pattern: "\\berror\\b.*(?<![\\w-])(?:depends-on)(?![\\w-])|(?<![\\w-])(?:depends-on)(?![\\w-]).*\\berror\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity error."
