schema_version: "1.1"
name: front-matter-validation/enum-value-out-of-range-is-warning
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 11: status outside the allowed values -> warning"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: enum_value_out_of_range_is_warning
    target: last_message
    pattern: "\\bwarning\\b.*(?<![\\w-])(?:status)(?![\\w-])|(?<![\\w-])(?:status)(?![\\w-]).*\\bwarning\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity warning."
