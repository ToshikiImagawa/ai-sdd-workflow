schema_version: "1.1"
name: front-matter-validation/crossref-id-duplicate-is-error
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 4: duplicate id under --cross-ref -> error"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: crossref_id_duplicate_is_error
    target: last_message
    pattern: "\\berror\\b.*(?<![\\w-])(?:id)(?![\\w-])|(?<![\\w-])(?:id)(?![\\w-]).*\\berror\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity error."
