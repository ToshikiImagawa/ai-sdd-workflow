schema_version: "1.1"
name: front-matter-validation/impl-status-reality-is-info
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 17: impl-status cannot be verified against code -> info"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: impl_status_reality_is_info
    target: last_message
    pattern: "\\binfo\\b.*(?<![\\w-])(?:impl-status)(?![\\w-])|(?<![\\w-])(?:impl-status)(?![\\w-]).*\\binfo\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity info."
