schema_version: "1.1"
name: front-matter-validation/type-location-mismatch-is-error
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 2: type does not match the directory -> error"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: type_location_mismatch_is_error
    target: last_message
    pattern: "\\berror\\b.*(?<![\\w-])(?:type)(?![\\w-])|(?<![\\w-])(?:type)(?![\\w-]).*\\berror\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity error."
