schema_version: "1.1"
name: front-matter-validation/front-matter-missing-is-info
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 16: document without front matter -> info"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: front_matter_missing_is_info
    target: last_message
    pattern: "\\binfo\\b.*(?<![\\w-])(?:front.?matter)(?![\\w-])|(?<![\\w-])(?:front.?matter)(?![\\w-]).*\\binfo\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity info."
