schema_version: "1.1"
name: front-matter-validation/laws-status-file-mismatch-is-warning
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 13: laws-status proven but LAWS.bend has no approval line -> warning"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: laws_status_file_mismatch_is_warning
    target: last_message
    pattern: "\\bwarning\\b.*(?<![\\w-])(?:laws-status)(?![\\w-])|(?<![\\w-])(?:laws-status)(?![\\w-]).*\\bwarning\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity warning."
