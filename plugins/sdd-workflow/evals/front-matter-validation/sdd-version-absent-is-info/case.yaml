schema_version: "1.1"
name: front-matter-validation/sdd-version-absent-is-info
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 19: sdd-version field absent -> info"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: sdd_version_absent_is_info
    target: last_message
    pattern: "\\binfo\\b.*(?<![\\w-])(?:sdd-version)(?![\\w-])|(?<![\\w-])(?:sdd-version)(?![\\w-]).*\\binfo\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity info."
