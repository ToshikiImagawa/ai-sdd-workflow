schema_version: "1.1"
name: front-matter-validation/laws-on-non-spec-is-warning
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 12: laws: on a non-spec document -> warning"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: laws_on_non_spec_is_warning
    target: last_message
    pattern: "\\bwarning\\b.*(?<![\\w-])(?:laws)(?![\\w-])|(?<![\\w-])(?:laws)(?![\\w-]).*\\bwarning\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity warning."
