schema_version: "1.1"
name: front-matter-validation/date-format-invalid-is-warning
description: "spec quality-guardrails/front-matter-validation 3.1.1 row 10: created/updated not in YYYY-MM-DD -> warning"
tags: [front-matter-validation, prose, spec-3.1.1]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: date_format_invalid_is_warning
    target: last_message
    pattern: "\\bwarning\\b.*(?<![\\w-])(?:created|updated|date)(?![\\w-])|(?<![\\w-])(?:created|updated|date)(?![\\w-]).*\\bwarning\\b"
    flags: im
    match: "contains"
expected_outcome: "The issue is reported with severity warning."
